name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + extension-host tests
        run: npm test

      - name: Packaged-artifact tests (VSIX)
        run: npm run test:package

      - name: Build VSIX
        if: matrix.node == '20'
        run: npm run package

      - name: Upload VSIX artifact
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: smart-publisher-vsix
          path: smart-publisher-*.vsix
          if-no-files-found: error
          retention-days: 14
